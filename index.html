<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ヒロイン・チャンピオン</title>
<style>
:root{--bg:#1d1b2e;--panel:#2a2742;--panel2:#363256;--line:#4c4775;--text:#f3f0ff;--sub:#b7b0d8;--accent:#ff7ab6;--accent2:#7ad7ff;--good:#5fd38a;--warn:#f2c230;--bad:#ef5b5b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Hiragino Kaku Gothic ProN","Noto Sans JP",Meiryo,sans-serif;line-height:1.5}
#app{max-width:760px;margin:0 auto;padding:12px 16px 40px}
button{font:inherit;color:inherit;background:var(--panel2);border:2px solid var(--line);border-radius:10px;padding:8px 14px;cursor:pointer;touch-action:manipulation}
button:hover:not(:disabled){border-color:var(--accent)}
button:disabled{opacity:.4;cursor:default}
button.primary{background:var(--accent);border-color:var(--accent);color:#2a0b1c;font-weight:bold}
.hidden{display:none!important}
.panel{background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sub{color:var(--sub);font-size:13px}
h1,h2,h3{margin:.2em 0 .4em}
#hud{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
#hud .info{font-size:14px}
#hud .row button{padding:5px 10px;font-size:13px}
.badge{display:inline-block;width:16px;height:16px;border-radius:50%;margin-left:2px;vertical-align:middle;border:2px solid #fff3}
.type{display:inline-block;padding:0 7px;border-radius:8px;font-size:12px;color:#1a1a1a;font-weight:bold}
.hpbar{height:9px;background:#0005;border-radius:5px;overflow:hidden;min-width:80px}
.hpbar>div{height:100%;transition:width .35s}
.expbar{height:4px;background:#0005;border-radius:3px;overflow:hidden;margin-top:2px}
.expbar>div{height:100%;background:var(--accent2)}
/* title */
.title{text-align:center;padding:30px 10px}
.title h1{font-size:40px;letter-spacing:2px;background:linear-gradient(90deg,#ff7ab6,#ffd27a,#7ad7ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.title .portraits{display:flex;justify-content:center;gap:4px;margin:18px 0}
/* world */
.node{display:flex;align-items:center;gap:12px;width:100%;text-align:left;margin-bottom:8px}
.node .ico{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:bold;flex:none}
.node.locked{opacity:.45}
/* battle */
.battle{display:flex;flex-direction:column;gap:8px}
.field{position:relative;border-radius:14px;padding:12px;min-height:250px;background:linear-gradient(#3b5d8a,#6d8fb5 55%,#5b8a4e 55%,#4a7a40)}
.field.cave{background:linear-gradient(#2c2433,#4a3d52 55%,#5a4a3e 55%,#45392f)}
.field.tower{background:linear-gradient(#8fb8d8,#cfe6f5 55%,#a9c9de 55%,#8fb2c9)}
.field.gym{background:linear-gradient(#4a2d5a,#7a4d8a 55%,#b88a5a 55%,#9a7048)}
.combatant{display:flex;align-items:flex-end;gap:10px}
.combatant.enemy{justify-content:flex-end;flex-direction:row}
.combatant.player{margin-top:6px}
.combatant .card{background:#1d1b2ee6;border-radius:10px;padding:6px 10px;min-width:180px;font-size:14px}
.pt{transition:transform .15s,filter .15s}
.pt.hit{animation:hit .35s}
.pt.faint{opacity:.15;transform:translateY(20px)}
@keyframes hit{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px);filter:brightness(2)}75%{transform:translateX(8px);filter:brightness(2)}}
.dots span{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:2px;background:var(--good)}
.dots span.off{background:#666}
.log{background:var(--panel);border:2px solid var(--line);border-radius:12px;padding:8px 12px;height:96px;overflow-y:auto;font-size:15px;cursor:pointer}
.log div{margin:1px 0}
.cmd{display:grid;grid-template-columns:1fr 1fr;gap:8px;min-height:92px}
.cmd button{padding:10px 8px}
.cmd .wide{grid-column:1/3}
.mv{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left}
.mv small{color:var(--sub);font-size:11px}
/* explore */
#cv{width:100%;height:auto;border-radius:12px;border:2px solid var(--line);display:block;image-rendering:pixelated;background:#000}
.dpad{display:grid;grid-template-columns:repeat(3,56px);grid-template-rows:repeat(3,48px);gap:4px;justify-content:center}
.dpad button{padding:0;font-size:20px}
/* modal */
#modal{position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;z-index:10;padding:16px}
#modal .box{background:var(--panel);border:2px solid var(--line);border-radius:16px;padding:16px;max-width:640px;width:100%;max-height:88vh;overflow-y:auto}
.talk{display:flex;gap:12px;align-items:center;cursor:pointer;min-height:90px}
.talk .who{font-weight:bold;color:var(--accent)}
.talk .next{text-align:right;color:var(--sub);font-size:12px}
.fcard{display:flex;gap:10px;align-items:center;background:var(--panel2);border-radius:12px;padding:8px;margin-bottom:8px}
.fcard .body{flex:1;min-width:0}
.fcard .acts{display:flex;flex-direction:column;gap:4px}
.fcard .acts button{padding:4px 8px;font-size:12px}
.fcard.sel{outline:2px solid var(--accent)}
.dex{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
.dex .cell{background:var(--panel2);border-radius:12px;padding:6px;text-align:center;font-size:12px}
.shopitem{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px;background:var(--panel2);border-radius:10px;margin-bottom:6px}
@media (max-width:520px){.title h1{font-size:30px}.combatant .card{min-width:140px}.grid2{grid-template-columns:1fr}}
</style>
</head>

/* ================== ヒロイン ================== */
const expFor=lv=>Math.floor(Math.pow(lv,3)*0.6);
function st(f,k){const b=SPECIES[f.sp].b;if(k==='hp')return Math.floor(b[0]*2*f.lv/100+f.lv+10);return Math.floor(b[{atk:1,def:2,spd:3}[k]]*2*f.lv/100+5)}
function learnset(s){const x=SPECIES[s];return [...LEARN[x.t],...(x.extra||[])].sort((a,b)=>a[0]-b[0])}
function initMoves(s,lv){const ids=[];for(const [l,m] of learnset(s))if(l<=lv&&!ids.includes(m))ids.push(m);return ids.slice(-4)}
function mk(s,lv,evo=true){
  if(evo)while(SPECIES[s].ev&&lv>=SPECIES[s].ev[1])s=SPECIES[s].ev[0];
  const f={uid:S?S.uid++:0,sp:s,lv,exp:expFor(lv),moves:initMoves(s,lv)};f.hp=st(f,'hp');return f;
}
function hpColor(r){return r>.5?'var(--good)':r>.2?'var(--warn)':'var(--bad)'}
function hpBar(f){const mx=st(f,'hp'),r=f.hp/mx;return `<div class="hpbar"><div style="width:${r*100}%;background:${hpColor(r)}"></div></div>`}
function expBar(f){const a=expFor(f.lv),b=expFor(f.lv+1),r=f.lv>=100?1:(f.exp-a)/(b-a);return `<div class="expbar"><div style="width:${Math.max(0,Math.min(1,r))*100}%"></div></div>`}

/* ポートレート(SVG) */
function portrait(id,size=96,sil=false){
  const s=SPECIES[id],tc=TC[s.t],hair=sil?'#111':s.hair,skin=sil?'#111':'#ffe2cc',out=sil?'#111':s.out,eye=sil?'#111':'#3a2a5a';
  let back='',acc='';
  if(s.style===1)back=`<path d="M26 46 Q24 88 30 92 L70 92 Q76 88 74 46 Z" fill="${hair}"/>`;
  if(s.style===2)back=`<ellipse cx="22" cy="58" rx="8" ry="20" fill="${hair}"/><ellipse cx="78" cy="58" rx="8" ry="20" fill="${hair}"/>`;
  if(s.style===3)back=`<path d="M64 30 Q90 34 84 70 Q80 54 66 44 Z" fill="${hair}"/>`;
  const side=`<path d="M28 48 Q26 66 32 72 L34 48 Z M72 48 Q74 66 68 72 L66 48 Z" fill="${hair}"/>`;
  const gold=sil?'#111':'#ffd24a';
  switch(s.acc){
    case'ribbon':acc=`<path d="M60 24 L72 16 L72 32 Z M60 24 L48 16 L48 32 Z" fill="${sil?'#111':'#ff5a8a'}" transform="translate(10,2)"/><circle cx="70" cy="26" r="3" fill="${sil?'#111':'#ff2a6a'}"/>`;break;
    case'hat':acc=`<path d="M22 32 Q50 22 78 32 L56 0 Q50 -4 48 6 Z" fill="${out}"/><ellipse cx="50" cy="32" rx="34" ry="6" fill="${out}"/><rect x="34" y="24" width="32" height="4" fill="${gold}"/>`;break;
    case'band':acc=`<rect x="28" y="33" width="44" height="5" rx="2" fill="${sil?'#111':'#e03a3a'}"/><path d="M72 35 L84 30 L82 42 Z" fill="${sil?'#111':'#e03a3a'}"/>`;break;
    case'crown':acc=`<path d="M36 26 L38 14 L44 22 L50 10 L56 22 L62 14 L64 26 Z" fill="${gold}"/><circle cx="50" cy="20" r="2.4" fill="${sil?'#111':'#ff4a6a'}"/>`;break;
    case'halo':acc=`<ellipse cx="50" cy="12" rx="18" ry="5" fill="none" stroke="${gold}" stroke-width="3"/>`;break;
    case'hood':acc=`<path d="M22 56 Q18 18 50 16 Q82 18 78 56 Q74 30 50 28 Q26 30 22 56 Z" fill="${out}"/>`;break;
    case'flower':acc=`<g transform="translate(70,30)">${[0,72,144,216,288].map(a=>`<ellipse cx="0" cy="-5" rx="3.5" ry="5" fill="${sil?'#111':'#ffb0d0'}" transform="rotate(${a})"/>`).join('')}<circle r="2.6" fill="${gold}"/></g>`;break;
  }
  return `<svg class="pt" width="${size}" height="${size}" viewBox="0 0 100 100" aria-label="${sil?'???':s.n}">
  <circle cx="50" cy="50" r="48" fill="${tc}" opacity="${sil?.15:.3}"/>
  ${back}
  <path d="M22 100 Q26 78 50 76 Q74 78 78 100 Z" fill="${out}"/>
  <path d="M42 77 L50 88 L58 77 Z" fill="${sil?'#111':'#fff'}" opacity=".85"/>
  <rect x="45" y="64" width="10" height="13" fill="${skin}"/>
  <ellipse cx="50" cy="51" rx="21" ry="23" fill="${skin}"/>
  ${sil?'':`<ellipse cx="42" cy="55" rx="3.4" ry="4.6" fill="${eye}"/><ellipse cx="58" cy="55" rx="3.4" ry="4.6" fill="${eye}"/>
  <circle cx="43.2" cy="53.4" r="1.3" fill="#fff"/><circle cx="59.2" cy="53.4" r="1.3" fill="#fff"/>
  <ellipse cx="37" cy="62" rx="4" ry="2" fill="#ff8aa8" opacity=".45"/><ellipse cx="63" cy="62" rx="4" ry="2" fill="#ff8aa8" opacity=".45"/>
  <path d="M46 65 Q50 68 54 65" stroke="#a04a5a" stroke-width="1.6" fill="none" stroke-linecap="round"/>`}
  ${side}
  <path d="M28 50 Q27 26 50 25 Q73 26 72 50 Q68 38 60 40 Q55 31 48 40 Q40 34 28 50 Z" fill="${hair}"/>
  ${acc}
  </svg>`;
}

/* ================== セーブ ================== */
let S=null;
const SAVE_KEY='heroine_champion_save_v1';
function save(silent){try{localStorage.setItem(SAVE_KEY,JSON.stringify(S));if(!silent)toast('セーブしました')}catch(e){if(!silent)toast('セーブできませんでした')}}
function load(){try{const t=localStorage.getItem(SAVE_KEY);return t?JSON.parse(t):null}catch(e){return null}}
function toast(t){const d=document.createElement('div');d.textContent=t;d.style.cssText='position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#000c;padding:8px 16px;border-radius:20px;z-index:20';document.body.appendChild(d);setTimeout(()=>d.remove(),1400)}

/* ================== 画面/モーダル ================== */
let SCREEN='title';
function show(html,name,hud=true){SCREEN=name;$('screen').innerHTML=html;$('hud').classList.toggle('hidden',!hud||!S);if(hud&&S)renderHud();window.scrollTo(0,0)}
function renderHud(){
  const b=GYMS.map((g,i)=>`<span class="badge" title="${g.badge}" style="background:${S.badges>i?g.color:'transparent'}"></span>`).join('');
  $('hud').innerHTML=`<div class="info"><b>${esc(S.name)}</b> ${S.champion?'👑':''} ・ ${S.money}G ・ バッジ${b}</div>
  <div class="row"><button onclick="openParty()">パーティ</button><button onclick="openBag()">バッグ</button><button onclick="openDex()">図鑑</button><button onclick="save()">セーブ</button></div>`;
}
function openModal(html){$('mbox').innerHTML=html;$('modal').classList.remove('hidden')}
function closeModal(){$('modal').classList.add('hidden');$('mbox').innerHTML='';if(S&&!$('hud').classList.contains('hidden'))renderHud();if(SCREEN==='explore')drawMap()}
const modalOpen=()=>!$('modal').classList.contains('hidden');

/* 会話: lines = [文字列 | {s:話者,t:本文,p:ポートレートID}] */
function talk(lines){
  return new Promise(res=>{
    let i=0;
    const step=()=>{
      if(i>=lines.length){$('modal').onclick=null;closeModal();res();return}
      let l=lines[i++];if(typeof l==='string')l={t:l};
      openModal(`<div class="talk">${l.p!=null?portrait(l.p,80):''}<div style="flex:1">${l.s?`<div class="who">${esc(l.s)}</div>`:''}<div>${esc(l.t).replace(/\n/g,'<br>')}</div><div class="next">▼ タップで次へ</div></div></div>`);
    };
    $('modal').onclick=step;step();
  });
}
function confirmBox(text,yes='はい',no='いいえ'){
  return new Promise(res=>{openModal(`<p>${esc(text)}</p><div class="row"><button class="primary" id="cy">${yes}</button><button id="cn">${no}</button></div>`);
    $('cy').onclick=()=>{closeModal();res(true)};$('cn').onclick=()=>{closeModal();res(false)}});
}

function worldMap(){

    if(a.kind==='route'||a.kind==='dungeon')st=(F(a.id)?'✓ 踏破 ・ ':'')+`Lv${a.lv[0]}〜${a.lv[1]}`+(a.floors>1?` ・ ${a.floors}階層`:'');
    if(a.kind==='league')st=S.champion?'👑 殿堂入り':'四天王とチャンピオン';
    return `<button class="node ${open?'':'locked'}" ${open?`onclick="enterArea('${a.id}')"`:'disabled'}><span class="ico" style="background:${col[a.kind]};color:#1a1a1a">${ico[a.kind]}</span><span><b>${open?a.name:'？？？'}</b><br><span class="sub">${open?st:'まだ進めない'}</span></span></button>`;

function enterArea(id){
  const a=AREAS.find(x=>x.id===id);

}

/* ================== 町 ================== */
function goTown(id){
  const a=AREAS.find(x=>x.id===id);S.lastTown=id;save(true);

  if(a.gym!=null){const g=GYMS[a.gym];gymBtn=S.badges>a.gym?`<button disabled>${g.name} ✓ ${g.badge}</button>`:
    S.badges===a.gym?`<button class="primary" onclick="challengeGym(${a.gym})">${g.name}に挑戦 (${g.type})</button>`:`<button disabled>${g.name}(前のバッジが必要)</button>`}
  show(`<div class="panel"><h2>${a.name}</h2><p class="sub">${a.desc}</p>
  <div class="row"><button onclick="inn()">宿屋で休む(無料)</button><button onclick="shop()">ショップ</button>${a.lab?'<button onclick="lab()">研究所</button>':''}${gymBtn}</div>

  <div class="panel" style="margin-top:10px"><h3>パーティ</h3>${S.party.map(f=>`<div class="row" style="margin-bottom:4px">${portrait(f.sp,40)}<span style="min-width:120px">${nm(f)} Lv${f.lv}</span><span style="flex:1">${hpBar(f)}</span><span class="sub">${f.hp}/${st(f,'hp')}</span></div>`).join('')}</div>`,'town');
}
async function inn(){healAll();await talk([{s:'宿屋の女将',t:'ゆっくりお休み…。\nヒロインたちはすっかり元気になったよ!'}]);goTown(S.lastTown)}
function healAll(){for(const f of [...S.party,...S.box])f.hp=st(f,'hp')}
async function lab(){
  const got=Object.keys(S.got).length;
  const hint=S.badges===0?'若葉の町のジムは草タイプ。炎タイプのヒロインが有利よ!':S.badges===1?'迷いの森を抜ければ港町マリーナ。森の主は強敵だけど、仲間にできるかも?':S.badges===2?'雷タイプには草タイプが強いわ。潮風の道から雷鳴の洞窟へ向かいなさい。':S.badges===3?'氷タイプには炎と拳が有効よ。氷結の塔を登りなさい。':'チャンピオンロードの先にセントラルリーグがあるわ。頑張って!';
  await talk([{s:'アカネ博士',t:`図鑑の進み具合は… 仲間にしたヒロイン ${got} / ${SPECIES.length} 人ね!`},{s:'アカネ博士',t:hint},{s:'アカネ博士',t:'ヒロインは一定のレベルに達すると進化するわ。控えのメンバーにも経験値が入るから、色々な子を育ててみて!'}]);
}

  }

function pTop(i){const [f]=S.party.splice(i,1);S.party.unshift(f);openParty()}
function pToBox(i){if(S.party.length<=1)return;if(S.party.filter((f,j)=>j!==i&&f.hp>0).length===0){toast('元気なヒロインが残りません');return}S.box.push(S.party.splice(i,1)[0]);openParty()}
function pFromBox(i){if(S.party.length>=6)return;S.party.push(S.box.splice(i,1)[0]);openParty()}
async function release(i){const f=S.box[i];closeModal();if(await confirmBox(`${nm(f)}(Lv${f.lv})と別れますか? 彼女は故郷へ帰ります。`)){S.box.splice(i,1);toast(`${nm(f)}は手を振って旅立っていった`)}openParty()}
function openBag(){
  const list=Object.entries(S.bag).filter(([k,n])=>n>0);
  openModal(`<h2>バッグ</h2>${list.length?list.map(([k,n])=>`<div class="shopitem"><div><b>${ITEMS[k].n}</b> ×${n}<br><span class="sub">${ITEMS[k].d}</span></div>${ITEMS[k].scout?'':`<button onclick="bagUse('${k}')">使う</button>`}</div>`).join(''):'<p class="sub">何も持っていません</p>'}<button onclick="closeModal()">閉じる</button>`);
}
function bagUse(k){
  openModal(`<h2>${ITEMS[k].n}を誰に使う?</h2>${S.party.map((f,i)=>fcard(f,`<button onclick="bagApply('${k}',${i})" ${canUse(k,f)?'':'disabled'}>使う</button>`)).join('')}<button onclick="openBag()">戻る</button>`);
}
function canUse(k,f){const it=ITEMS[k];if(it.revive)return f.hp<=0;if(it.heal)return f.hp>0&&f.hp<st(f,'hp');return false}
function applyItem(k,f){const it=ITEMS[k],mx=st(f,'hp');S.bag[k]--;const b=f.hp;if(it.revive)f.hp=Math.floor(mx/2);else f.hp=Math.min(mx,f.hp+it.heal);return f.hp-b}
function bagApply(k,i){const f=S.party[i];if(!canUse(k,f))return;const d=applyItem(k,f);toast(`${nm(f)}のHPが${d}回復した`);if((S.bag[k]||0)>0)bagUse(k);else openBag()}
function openDex(){

}

/* ================== 探索 (道路・ダンジョン) ================== */
const MW=25,MH=17,TS=28;
let X=null;
function genFloor(a,fl){
  const m=Array.from({length:MH},()=>Array(MW).fill(0));
  let x=2,y=8,cnt=0;const target=Math.floor(MW*MH*0.44);
  const carve=(x,y)=>{if(x<1||y<1||x>MW-2||y>MH-2)return;if(m[y][x]===0){m[y][x]=1;cnt++}};
  carve(x,y);let guard=0;
  while(cnt<target&&guard++<30000){
    let d=pick([[1,0],[-1,0],[0,1],[0,-1]]);if(Math.random()<.12)d=[1,0];
    x=Math.max(1,Math.min(MW-2,x+d[0]));y=Math.max(1,Math.min(MH-2,y+d[1]));carve(x,y);
    if(Math.random()<.25){carve(x+1,y);carve(x,y+1)}
  }
  // BFS
  const dist=Array.from({length:MH},()=>Array(MW).fill(-1));const q=[[2,8]];dist[8][2]=0;let far=[2,8];
  while(q.length){const [cx,cy]=q.shift();if(dist[cy][cx]>dist[far[1]][far[0]])far=[cx,cy];
    for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){const nx=cx+dx,ny=cy+dy;if(m[ny]&&m[ny][nx]===1&&dist[ny][nx]<0){dist[ny][nx]=dist[cy][cx]+1;q.push([nx,ny])}}}
  // 草むら
  const blobs=a.kind==='route'?9:0;
  for(let b=0;b<blobs;b++){const bx=R(2,MW-3),by=R(2,MH-3),r=R(2,3);
    for(let yy=by-r;yy<=by+r;yy++)for(let xx=bx-r;xx<=bx+r;xx++)if(m[yy]&&m[yy][xx]===1&&Math.hypot(xx-bx,yy-by)<=r+.3)m[yy][xx]=2}
  m[8][2]=1;
  const ex={x:far[0],y:far[1]};m[ex.y][ex.x]=3;
  const free=[];for(let yy=0;yy<MH;yy++)for(let xx=0;xx<MW;xx++)if((m[yy][xx]===1||m[yy][xx]===2)&&dist[yy][xx]>5)free.push([xx,yy]);
  const used=new Set();const take=()=>{for(let k=0;k<50;k++){const p=pick(free);const key=p+'';if(p&&!used.has(key)){used.add(key);return p}}return null};
  const trainers=[];const nT=a.trainers;
  for(let t=0;t<nT;t++){const p=take();if(!p)break;const n=R(1,Math.min(3,1+fl+(a.kind==='dungeon'?1:0)));
    const team=[];for(let k=0;k<n;k++)team.push([wpick(a.wild),R(a.lv[1]-2,a.lv[1])]);
    trainers.push({x:p[0],y:p[1],name:pick(TRAINER_NAMES),team,done:false})}
  const chests=[];const nC=R(1,2);for(let c=0;c<nC;c++){const p=take();if(p)chests.push({x:p[0],y:p[1],open:false})}
  return {m,ex,trainers,chests,px:2,py:8};
}
function startExplore(a){
  X={a,fl:0,busy:false,...genFloor(a,0)};
  renderExplore();
}
function renderExplore(){
  const a=X.a,last=X.fl===a.floors-1;
  show(`<div class="row" style="justify-content:space-between;margin-bottom:6px"><h3 style="margin:0">${a.name}${a.floors>1?` ${X.fl+1}F / ${a.floors}F`:''}</h3>
  <span class="sub">${a.kind==='route'?'草むらで野生のヒロインに出会える':'どこでも野生のヒロインが出る'} ・ ${last?(a.boss&&!F(a.id)?'★ボスが待つ':'出口'):'▼階段'}を目指せ</span></div>
  <canvas id="cv" width="${MW*TS}" height="${MH*TS}"></canvas>
  <div class="row" style="justify-content:space-between;margin-top:8px;align-items:flex-start">
   <div class="dpad"><span></span><button onclick="step(0,-1)">▲</button><span></span><button onclick="step(-1,0)">◀</button><span></span><button onclick="step(1,0)">▶</button><span></span><button onclick="step(0,1)">▼</button><span></span></div>
   <div style="display:flex;flex-direction:column;gap:6px;flex:1;min-width:180px">
    <div class="panel" style="padding:8px;font-size:13px">${S.party.map(f=>`<div class="row" style="gap:6px"><span style="min-width:96px">${nm(f)} Lv${f.lv}</span><span style="flex:1">${hpBar(f)}</span></div>`).join('')}</div>
    <button onclick="leaveArea()">エリアから脱出する</button>
   </div></div>`,'explore');
  drawMap();
}
function drawMap(){
  const cv=$('cv');if(!cv||!X)return;const c=cv.getContext('2d'),th=THEME[X.a.theme],last=X.fl===X.a.floors-1;
  for(let y=0;y<MH;y++)for(let x=0;x<MW;x++){
    const t=X.m[y][x],px=x*TS,py=y*TS;
    c.fillStyle=t===0?th.wall:t===2?th.grass:th.floor;c.fillRect(px,py,TS,TS);
    if(t===0){c.fillStyle='#0003';if(X.a.theme==='grass'||X.a.theme==='forest'){c.beginPath();c.arc(px+TS/2,py+TS/2,TS*.42,0,7);c.fillStyle='#0002';c.fill()}else c.fillRect(px+2,py+TS-6,TS-4,4)}
    if(t===2){c.strokeStyle='#ffffff40';c.lineWidth=2;for(const o of[6,14,22]){c.beginPath();c.moveTo(px+o,py+TS-5);c.lineTo(px+o+3,py+10);c.stroke()}}
    if(t===3){
      if(last&&X.a.boss&&!F(X.a.id)){c.fillStyle='#c47ae0';c.beginPath();c.arc(px+TS/2,py+TS/2,TS*.45,0,7);c.fill();c.fillStyle='#fff';c.font=`bold ${TS*.6}px sans-serif`;c.textAlign='center';c.textBaseline='middle';c.fillText('★',px+TS/2,py+TS/2+1)}
      else{c.fillStyle='#ffd24a';c.fillRect(px+3,py+3,TS-6,TS-6);c.fillStyle='#3a2a00';c.font=`bold ${TS*.55}px sans-serif`;c.textAlign='center';c.textBaseline='middle';c.fillText(last?'出':'▼',px+TS/2,py+TS/2+1)}
    }
  }
  // 入口
  c.strokeStyle='#ffffff80';c.lineWidth=2;c.strokeRect(2*TS+3,8*TS+3,TS-6,TS-6);
  for(const ch of X.chests){if(ch.open)continue;const px=ch.x*TS,py=ch.y*TS;c.fillStyle='#8a5a2a';c.fillRect(px+5,py+8,TS-10,TS-13);c.fillStyle='#ffd24a';c.fillRect(px+5,py+13,TS-10,3);c.fillRect(px+TS/2-2,py+12,4,6)}
  for(const t of X.trainers){if(t.done)continue;const px=t.x*TS+TS/2,py=t.y*TS+TS/2;c.fillStyle='#e0503a';c.beginPath();c.arc(px,py,TS*.38,0,7);c.fill();c.fillStyle='#fff';c.font=`bold ${TS*.5}px sans-serif`;c.textAlign='center';c.textBaseline='middle';c.fillText('!',px,py+1)}
  const px=X.px*TS+TS/2,py=X.py*TS+TS/2;
  c.fillStyle='#fff';c.beginPath();c.arc(px,py,TS*.42,0,7);c.fill();
  c.fillStyle='#3a6ad8';c.beginPath();c.arc(px,py,TS*.34,0,7);c.fill();
  c.fillStyle='#ffe2cc';c.beginPath();c.arc(px,py+2,TS*.2,0,7);c.fill();
  c.fillStyle='#e03a3a';c.fillRect(px-TS*.3,py-TS*.32,TS*.6,TS*.16);
}
async function step(dx,dy){
  if(!X||X.busy||SCREEN!=='explore'||modalOpen())return;
  const nx=X.px+dx,ny=X.py+dy;if(nx<0||ny<0||nx>=MW||ny>=MH)return;
  const t=X.m[ny][nx];if(t===0)return;
  const tr=X.trainers.find(o=>!o.done&&o.x===nx&&o.y===ny);
  X.busy=true;
  try{
    if(tr){await trainerBattle(tr);return}
    const last=X.fl===X.a.floors-1;
    if(t===3&&last&&X.a.boss&&!F(X.a.id)){await bossBattle();return}
    X.px=nx;X.py=ny;drawMap();
    const ch=X.chests.find(o=>!o.open&&o.x===nx&&o.y===ny);
    if(ch){ch.open=true;await openChest();drawMap()}
    if(t===3){if(last)await clearArea();else await nextFloor();return}
    const rate=t===2?.13:(X.a.kind==='dungeon'?.07:0);
    if(Math.random()<rate)await wildBattle();
  }finally{if(X)X.busy=false}
}
async function openChest(){
  const r=Math.random(),lvl=X.a.lv[1];let txt;
  if(r<.35){const k=S.badges>=2?'superp':'potion';S.bag[k]=(S.bag[k]||0)+1;txt=`${ITEMS[k].n}を見つけた!`}
  else if(r<.65){const k=S.badges>=2&&Math.random()<.4?'gcard':'card';const n=k==='card'?2:1;S.bag[k]=(S.bag[k]||0)+n;txt=`${ITEMS[k].n}を${n}枚見つけた!`}
  else if(r<.8&&S.badges>=1){S.bag.revive=(S.bag.revive||0)+1;txt='気つけ薬を見つけた!'}
  else{const g=lvl*30;S.money+=g;txt=`${g}Gを見つけた!`}
  await talk(['宝箱を開けた!',txt]);
}
async function nextFloor(){
  await talk([`階段を進んだ… (${X.fl+2}F)`]);
  X={...X,fl:X.fl+1,...genFloor(X.a,X.fl+1)};renderExplore();
}
async function clearArea(){
  const a=X.a,first=!F(a.id);S.flags[a.id]=true;
  const next=AREAS[AREAS.indexOf(a)+1];
  await talk([`${a.name}を${a.kind==='route'?'抜けた':'踏破した'}!`].concat(first&&next?[`新しい場所「${next.name}」に行けるようになった!`]:[]));
  X=null;save(true);
  if(next&&next.kind==='town')goTown(next.id);else worldMap();
}
async function leaveArea(){
  if(X&&X.busy)return;
  if(!await confirmBox('エリアから脱出してワールドマップに戻りますか?'))return;
  X=null;worldMap();
}
document.addEventListener('keydown',e=>{
  if(SCREEN!=='explore')return;
  const k={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0],w:[0,-1],s:[0,1],a:[-1,0],d:[1,0]}[e.key];
  if(k){e.preventDefault();step(k[0],k[1])}
});
async function wildBattle(){
  const s=wpick(X.a.wild),f=mk(s,R(X.a.lv[0],X.a.lv[1]));
  const r=await battle({enemies:[f],wild:true,field:THEME[X.a.theme].field});
  if(r==='lose')return blackout();
  renderExplore();
}
async function trainerBattle(t){
  await talk([{s:t.name,t:pick(['目が合ったらバトルだよ!','私のヒロインたちの強さ、見せてあげる!','ここを通りたければ勝負だ!','腕試しにちょうどいい相手だ!'])}]);
  const r=await battle({enemies:t.team.map(([s,l])=>mk(s,l)),trainer:{name:t.name},field:THEME[X.a.theme].field});
  if(r==='lose')return blackout();
  t.done=true;renderExplore();
}
async function bossBattle(){
  const [s,l]=X.a.boss,b=SPECIES[s];
  await talk([`強大な気配を感じる…!`,{s:b.n,p:s,t:`わたしは${b.ti}、${b.n}。この先へ進みたいなら、その力を示しなさい!`}]);
  const r=await battle({enemies:[mk(s,l,false)],wild:true,boss:true,field:THEME[X.a.theme].field});
  if(r==='lose')return blackout();
  if(r==='run'){renderExplore();return}
  if(r!=='scout')await talk([{s:b.n,p:s,t:'…見事ね。あなたなら、この先へ進む資格があるわ。\n(またいつか会えたら、その時は仲間に…)'}]);
  await clearArea();
}
async function blackout(){
  const lost=Math.floor(S.money/2);S.money-=lost;healAll();X=null;
  await talk([`${S.name}の手持ちのヒロインは全員戦えなくなった…`,`${lost}Gを落としてしまった…`,'目の前が真っ暗になった…']);
  goTown(S.lastTown);
}

/* ================== ジム / リーグ ================== */
function interstitial(title,foe,idx,total){
  return new Promise(res=>{
    show(`<div class="panel" style="text-align:center"><h2>${title}</h2><p class="sub">${idx+1} / ${total} 戦目</p><h3>次の相手: ${esc(foe.name)}</h3>
    <p class="sub">手持ち ${foe.team.length}人</p><p class="sub">戦いの合間に回復できるのはバッグの道具だけ!</p>
    <div class="row" style="justify-content:center"><button class="primary" id="ig">挑む!</button><button id="iq">撤退する</button></div></div>
    <div class="panel" style="margin-top:10px">${S.party.map(f=>`<div class="row" style="margin-bottom:4px">${portrait(f.sp,40)}<span style="min-width:120px">${nm(f)} Lv${f.lv}</span><span style="flex:1">${hpBar(f)}</span><span class="sub">${f.hp}/${st(f,'hp')}</span></div>`).join('')}</div>`,'inter');
    $('ig').onclick=()=>{if(!S.party.some(f=>f.hp>0)){toast('戦えるヒロインがいません');return}res(true)};$('iq').onclick=()=>res(false);
  });
}
async function challengeGym(gi){
  const g=GYMS[gi];
  const foes=[...g.trainers,{name:'ジムリーダー '+g.leader,team:g.team,leader:true}];
  for(let i=0;i<foes.length;i++){
    const ok=await interstitial(g.name,foes[i],i,foes.length);
    if(!ok)return goTown(S.lastTown);
    if(foes[i].leader)await talk([{s:foes[i].name,t:g.intro}]);
    const r=await battle({enemies:foes[i].team.map(([s,l])=>mk(s,l,false)),trainer:{name:foes[i].name,leader:true},field:'gym'});
    if(r==='lose')return blackout();
  }
  S.badges=gi+1;S.money+=1000*(gi+1);
  await talk([{s:'ジムリーダー '+g.leader,t:g.win},`${g.badge}を手に入れた! 賞金${1000*(gi+1)}Gも受け取った!`]);
  save(true);goTown(S.lastTown);
}

/* ================== バトル ================== */
let B=null;
const bm=s=>s>=0?(2+s)/2:2/(2-s);
const pf=()=>S.party[B.pi];
const ef=()=>B.enemies[B.ei];
function battle(opt){
  return new Promise(res=>{
    B={...opt,ei:0,pi:S.party.findIndex(f=>f.hp>0),pb:{atk:0,def:0},eb:{atk:0,def:0},busy:true,ended:false,res,mustSwitch:false};
    S.seen[ef().sp]=true;
    renderBattle();
    (async()=>{
      if(B.trainer)await msg(`${B.trainer.name}が勝負を仕掛けてきた!`);
      if(B.trainer)await msg(`${B.trainer.name}は${nm(ef())}を繰り出した!`);
      else if(B.boss)await msg(`${sp(ef()).ti}${nm(ef())}が立ちはだかった!`);
      else await msg(`野生の${nm(ef())}(${sp(ef()).ti})が勝負を挑んできた!`);
      await msg(`行け! ${nm(pf())}!`);
      B.busy=false;mainCmd();
    })();
  });
}
function renderBattle(){
  show(`<div class="battle"><div class="field ${B.field||''}">
   <div class="combatant enemy"><div class="card" id="einfo"></div><div id="ept"></div></div>
   <div class="combatant player"><div id="ppt"></div><div class="card" id="pinfo"></div></div></div>
   <div class="log" id="blog" onclick="skipMsg()"></div><div class="cmd" id="bcmd"></div></div>`,'battle',false);
  updB(true);
}
function updB(redraw){
  const E=ef(),P=pf();
  const dots=B.trainer?`<div class="dots">${B.enemies.map(f=>`<span class="${f.hp>0?'':'off'}"></span>`).join('')}</div>`:'';
  $('einfo').innerHTML=`${dots}<b>${nm(E)}</b> ${typeTag(sp(E).t)} Lv${E.lv}${S.got[E.sp]?' <span title="仲間にしたことがある">◆</span>':''}${hpBar(E)}${buffTxt(B.eb)}`;
  $('pinfo').innerHTML=`<b>${nm(P)}</b> ${typeTag(sp(P).t)} Lv${P.lv}${hpBar(P)}<div class="sub">HP ${P.hp}/${st(P,'hp')} ${buffTxt(B.pb)}</div>${expBar(P)}`;
  if(redraw){$('ept').innerHTML=portrait(E.sp,B.boss?140:120);$('ppt').innerHTML=portrait(P.sp,120)}
}
function buffTxt(b){const t=[];if(b.atk)t.push(`攻${b.atk>0?'↑':'↓'}${Math.abs(b.atk)}`);if(b.def)t.push(`防${b.def>0?'↑':'↓'}${Math.abs(b.def)}`);return t.length?`<span class="sub">${t.join(' ')}</span>`:''}
let skipFn=null;
function skipMsg(){if(skipFn)skipFn()}
function msg(t){
  const l=$('blog');if(!l)return Promise.resolve();
  const d=document.createElement('div');d.textContent=t;l.appendChild(d);l.scrollTop=l.scrollHeight;
  return new Promise(r=>{const done=()=>{skipFn=null;r()};skipFn=done;setTimeout(done,S.fast?260:650)});
}
function setCmd(h){const c=$('bcmd');if(c)c.innerHTML=h}
function mainCmd(){
  if(B.ended)return;
  setCmd(`<button onclick="moveCmd()">たたかう</button><button onclick="scoutCmd()" ${B.trainer?'disabled':''}>スカウト</button>
  <button onclick="itemCmd()">どうぐ</button><button onclick="switchCmd(false)">こうたい</button>
  <button onclick="doTurn({k:'run'})" ${B.trainer?'disabled':''}>にげる</button><button onclick="S.fast=!S.fast;mainCmd()">速度: ${S.fast?'はやい':'ふつう'}</button>`);
}
function moveCmd(){
  const P=pf(),E=ef();
  setCmd(P.moves.map(id=>{const m=MOVES[id];let note=m.k==='heal'?'HP回復':m.k==='buff'?'自分の'+(m.stat==='atk'?'攻撃':'防御')+'↑':m.k==='debuff'?'相手の防御↓':`威力${m.p} 命中${m.a}`;
    if(!m.k){const e=eff(m.t,sp(E).t);if(e>1)note+=' ・ 効果ばつぐん';else if(e<1)note+=' ・ いまひとつ'}
    return `<button class="mv" onclick="doTurn({k:'move',m:'${id}'})" style="border-color:${TC[m.t]}"><span>${m.n} ${typeTag(m.t)}</span><small>${note}</small></button>`}).join('')+`<button class="wide" onclick="mainCmd()">もどる</button>`);
}
function scoutCmd(){
  const cards=['card','gcard'].filter(k=>(S.bag[k]||0)>0);
  if(!cards.length){setCmd(`<div class="wide sub" style="padding:8px">スカウトカードを持っていない!</div><button class="wide" onclick="mainCmd()">もどる</button>`);return}
  const E=ef(),r=E.hp/st(E,'hp');
  setCmd(cards.map(k=>`<button onclick="doTurn({k:'scout',item:'${k}'})">${ITEMS[k].n} ×${S.bag[k]}</button>`).join('')+`<div class="wide sub">HPが減っているほど誘いに応じてくれやすい(現在HP ${Math.round(r*100)}%)</div><button class="wide" onclick="mainCmd()">もどる</button>`);
}
function itemCmd(){
  const list=Object.entries(S.bag).filter(([k,n])=>n>0&&!ITEMS[k].scout);
  setCmd(list.map(([k,n])=>`<button onclick="itemTarget('${k}')">${ITEMS[k].n} ×${n}</button>`).join('')+(list.length?'':'<div class="wide sub">使える道具がない</div>')+`<button class="wide" onclick="mainCmd()">もどる</button>`);
}
function itemTarget(k){
  setCmd(S.party.map((f,i)=>`<button onclick="doTurn({k:'item',item:'${k}',i:${i}})" ${canUse(k,f)?'':'disabled'}>${nm(f)} ${f.hp}/${st(f,'hp')}</button>`).join('')+`<button class="wide" onclick="itemCmd()">もどる</button>`);
}
function switchCmd(forced){
  setCmd(S.party.map((f,i)=>`<button onclick="${forced?`forcedSwitch(${i})`:`doTurn({k:'switch',i:${i}})`}" ${f.hp<=0||i===B.pi?'disabled':''}>${nm(f)} Lv${f.lv} ${f.hp}/${st(f,'hp')}</button>`).join('')+(forced?'<div class="wide sub">次に戦うヒロインを選んでください</div>':`<button class="wide" onclick="mainCmd()">もどる</button>`));
}
async function forcedSwitch(i){
  if(B.busy)return;B.busy=true;setCmd('');
  B.pi=i;B.pb={atk:0,def:0};B.mustSwitch=false;updB(true);await msg(`行け! ${nm(pf())}!`);
  B.busy=false;mainCmd();
}
function aiMove(){
  const E=ef(),P=pf(),mx=st(E,'hp');let best=null,bs=-1;
  for(const id of E.moves){const m=MOVES[id];let s;
    if(m.k==='heal')s=E.hp<mx*.4?140:0;
    else if(m.k==='buff')s=B.eb[m.stat]<2?28:0;
    else if(m.k==='debuff')s=B.pb.def>-2?22:0;
    else s=m.p*eff(m.t,sp(P).t)*(m.t===sp(E).t?1.5:1)*(m.a/100);
    s*=.75+Math.random()*.5;if(s>bs){bs=s;best=id}}
  return best;
}
async function doTurn(act){
  if(B.busy||B.ended)return;B.busy=true;setCmd('');
  const eMove=aiMove();
  if(act.k==='move'){
    const pm=MOVES[act.m],em=MOVES[eMove];
    const ps=st(pf(),'spd'),es=st(ef(),'spd');
    const pFirst=(pm.pri||0)!==(em.pri||0)?(pm.pri||0)>(em.pri||0):ps!==es?ps>es:Math.random()<.5;
    if(pFirst){await attack(true,act.m);if(!await afterHit())await (attack(false,eMove).then(afterHit))}
    else{await attack(false,eMove);if(!await afterHit())await (attack(true,act.m).then(afterHit))}
  }else{
    if(act.k==='switch'){await msg(`戻れ、${nm(pf())}!`);B.pi=act.i;B.pb={atk:0,def:0};updB(true);await msg(`行け! ${nm(pf())}!`)}
    if(act.k==='item'){const f=S.party[act.i];const it=ITEMS[act.item];const d=applyItem(act.item,f);await msg(`${it.n}を使った! ${nm(f)}のHPが${d}回復した!`);
      updB(false)}
    if(act.k==='scout'){if(await tryScout(act.item))return endBattle('scout')}
    if(act.k==='run'){
      const p=Math.min(.95,.5+.4*st(pf(),'spd')/Math.max(1,st(ef(),'spd'))-(B.boss?.3:0));
      if(Math.random()<p){await msg('うまく逃げ切れた!');return endBattle('run')}
      await msg('逃げられなかった!');
    }
    await attack(false,eMove);await afterHit();
  }
  if(!B||B.ended)return;
  B.busy=false;
  if(B.mustSwitch)switchCmd(true);else mainCmd();
}
async function attack(isP,id){
  const A=isP?pf():ef(),D=isP?ef():pf(),ab=isP?B.pb:B.eb,db=isP?B.eb:B.pb,m=MOVES[id];
  const an=(isP?'':'相手の')+nm(A),dn=(isP?'相手の':'')+nm(D);
  await msg(`${an}の${m.n}!`);
  if(m.k==='heal'){const mx=st(A,'hp');if(A.hp>=mx){await msg('しかし体力は満タンだ!');return}A.hp=Math.min(mx,A.hp+Math.floor(mx/2));updB(false);await msg(`${an}の体力が回復した!`);return}
  if(m.k==='buff'){if(ab[m.stat]>=3){await msg('これ以上あがらない!');return}ab[m.stat]++;updB(false);await msg(`${an}の${m.stat==='atk'?'攻撃':'防御'}があがった!`);return}
  if(m.k==='debuff'){if(db[m.stat]<=-3){await msg('これ以上さがらない!');return}db[m.stat]--;updB(false);await msg(`${dn}の防御がさがった!`);return}
  if(Math.random()*100>=m.a){await msg('しかし攻撃は外れた!');return}
  const e=eff(m.t,sp(D).t),crit=Math.random()<.0625;
  const Av=st(A,'atk')*bm(ab.atk),Dv=st(D,'def')*bm(crit?Math.min(0,db.def):db.def);
  const base=Math.floor((2*A.lv/5+2)*m.p*Av/Dv/50)+2;
  const dmg=Math.max(1,Math.floor(base*(m.t===sp(A).t?1.5:1)*e*(crit?1.5:1)*(.85+Math.random()*.15)));
  D.hp=Math.max(0,D.hp-dmg);
  const el=$(isP?'ept':'ppt');const svg=el&&el.firstElementChild;if(svg){svg.classList.remove('hit');void svg.getBoundingClientRect();svg.classList.add('hit')}
  updB(false);
  if(crit)await msg('急所に当たった!');
  if(e>1)await msg('効果はばつぐんだ!');else if(e<1)await msg('効果はいまひとつのようだ…');
  if(m.drain&&A.hp>0){const h=Math.max(1,Math.floor(dmg/2));A.hp=Math.min(st(A,'hp'),A.hp+h);updB(false);await msg(`${an}は体力を吸い取った!`)}
}
// 戦闘不能チェック: ターンを打ち切るなら true
async function afterHit(){
  const E=ef(),P=pf();
  if(E.hp<=0){
    const svg=$('ept').firstElementChild;if(svg)svg.classList.add('faint');
    await msg(`${B.trainer?'相手の':'野生の'}${nm(E)}は倒れた!`);
    const gain=Math.floor(sp(E).x*E.lv/4*(B.trainer?1.5:1));
    for(const f of S.party){if(f.hp<=0)continue;await giveExp(f,f===P?gain:Math.floor(gain/2),f===P)}
    updB(false);
    const ni=B.enemies.findIndex(f=>f.hp>0);
    if(ni<0){
      if(B.trainer){const prize=Math.max(...B.enemies.map(f=>f.lv))*(B.trainer.leader?60:25);S.money+=prize;await msg(`${B.trainer.name}との勝負に勝った!`);await msg(`賞金${prize}Gを手に入れた!`)}
      await endBattle('win');return true;
    }
    B.ei=ni;B.eb={atk:0,def:0};S.seen[ef().sp]=true;
    await msg(`${B.trainer.name}は${nm(ef())}を繰り出した!`);updB(true);
    return true;
  }
  if(P.hp<=0){
    const svg=$('ppt').firstElementChild;if(svg)svg.classList.add('faint');
    await msg(`${nm(P)}は倒れた!`);
    if(!S.party.some(f=>f.hp>0)){await endBattle('lose');return true}
    B.mustSwitch=true;return true;
  }
  return false;
}
async function giveExp(f,g,active){
  if(f.lv>=100)return;
  f.exp+=g;if(active)await msg(`${nm(f)}は${g}の経験値を得た!`);
  while(f.lv<100&&f.exp>=expFor(f.lv+1)){
    const oldMax=st(f,'hp');f.lv++;if(f.hp>0)f.hp+=st(f,'hp')-oldMax;
    await msg(`${nm(f)}はレベル${f.lv}にあがった!`);
    for(const [l,id] of learnset(f.sp))if(l===f.lv&&!f.moves.includes(id))await learnMove(f,id);
  }
  if(f===pf())updB(false);
}
async function learnMove(f,id){
  const m=MOVES[id];
  if(f.moves.length<4){f.moves.push(id);await msg(`${nm(f)}は${m.n}を覚えた!`);return}
  // 威力の低い攻撃技、または補助技(同種)を入れ替える
  let worst=-1,wp=Infinity;
  f.moves.forEach((x,i)=>{const mm=MOVES[x];const p=mm.k?(m.k===mm.k?0:999):mm.p;if(p<wp){wp=p;worst=i}});
  if(m.k?wp===0:wp<m.p){const old=MOVES[f.moves[worst]].n;f.moves[worst]=id;await msg(`${nm(f)}は${old}を忘れて${m.n}を覚えた!`)}
}
async function tryScout(k){
  const it=ITEMS[k],E=ef(),s=sp(E);S.bag[k]--;
  await msg(`${S.name}は${it.n}を差し出した!`);
  const r=E.hp/st(E,'hp');const p=Math.min(.95,s.c*(1-.8*r)*it.scout+.04);
  await msg('……');await msg('…………');
  if(Math.random()<p){
    await msg(`${nm(E)}「${pick(['あなたの実力、認めるわ。一緒に行かせて!','ふふっ、面白い人。ついていってあげる!','あなたとなら、もっと強くなれそう!','…負けたわ。これからよろしくね!'])}」`);
    await msg(`${nm(E)}が仲間になった!`);
    E.uid=S.uid++;S.got[E.sp]=true;
    if(S.party.length<6)S.party.push(E);else{S.box.push(E);await msg(`${nm(E)}はボックスで待っている。`)}
    return true;
  }
  await msg(`${nm(E)}「${pick(['まだ認めないわ!','もっと本気を見せて!','その程度じゃ仲間にはなれないわね!','うーん、まだ考え中…!'])}」`);
  return false;
}
async function endBattle(r){
  B.ended=true;B.busy=true;setCmd('');
  if(r!=='lose'){
    for(const f of S.party){
      const s=sp(f);
      if(s.ev&&f.lv>=s.ev[1]&&f.hp>0){
        const from=f.sp,to=s.ev[0],ratio=f.hp/st(f,'hp');
        await talk([{p:from,t:`…おや? ${s.n}の様子が……!`}]);
        f.sp=to;f.hp=Math.max(1,Math.round(st(f,'hp')*ratio));S.got[to]=S.seen[to]=true;
        await talk([{p:to,s:SPECIES[to].n,t:`${s.n}は${SPECIES[to].ti}「${SPECIES[to].n}」に進化した!`}]);
      }
    }
  }
  const res=B.res;B=null;
  save(true);res(r);
}

/* ================== 起動 ================== */
titleScreen();
</script>
